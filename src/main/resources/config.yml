training:
  # Also write label-first CSV beside the JSONL recordings.
  csv-enabled: true

# =========================================
#       SilentAC Configuration
# =========================================

#API Connector
vds:
  # For an API on another machine: https://ac.example.com (takes precedence over ip/port).
  url: ""
  ip: "127.0.0.1"
  port: 8000
  secret_key: ""


checks:
  aim:
    enabled: true


autoban:
  enable: false
  command: 'kick {player} [SilentAC] Aim detection'
  # Broadcast message (leave empty '' to disable)
  broadcast-message: ''

ai:
  # Observe scores only until independently validated on real players.
  observe-only: true
  # DON'T TOUCH IF YOU DON'T KNOW WHAT THIS DOES!!!
  # DON'T touch IF YOU DON'T KNOW WHAT THIS DOES!!!
  # DON'T touch IF YOU DON'T KNOW WHAT THIS DOES!!!
  sequence: 40

  # DON'T TOUCH IF YOU DON'T KNOW WHAT THIS DOES!!!
  # DON'T touch IF YOU DON'T KNOW WHAT THIS DOES!!!
  # DON'T touch IF YOU DON'T KNOW WHAT THIS DOES!!!
  step: 10



  buffer:
    # Buffer score required to ban the player
    flag: 50.0
    # Value to reset buffer to after a flag
    reset-on-flag: 0
    # How much to add to buffer if AI is confident (>90%)
    # Formula: (sus - 0.9) * multiplier
    multiplier: 40.0
    # How much to subtract from buffer if AI thinks player is legit (<10%)
    decrease: 5.5



  # Damage Reduction (Soft Ban)
  # If AI is suspicious but the buffer isn't full yet, reduce damage dealt.
  damage-reduction:
    enabled: false
    # Suspicion threshold to start reducing damage (0.0 to 1.0)
    suspicion: 0.9
    # Reduction Strength (1.0 = Reduce to 0 damage at 100% confidence)
    multiplier: 1.0


appearance:
  version: 1

recording:
  # Explicitly announce the chosen label on start. Override with [legit|cheat].
  default-label: legit

messages:
  prefix: '<gradient:#FFFFFF:#A0A0A0><bold>SilentAC</bold></gradient> <dark_gray>»</dark_gray> '
  no_permission: '<gray>Недостаточно прав.'
  player_only: '<gray>Эта команда доступна только игроку.'
  player_not_found: '<gray>Игрок <gradient:#FFFFFF:#B0B0B0>{player}</gradient> не в сети.'
  invalid_usage: '<gray>Помощь: <white>/anguard help'
  recording_usage: '<gray>/anguard recording start <white><name> [time] [legit|cheat]</white> <dark_gray>·</dark_gray> /anguard recording stop <white><name>'
  invalid_time: '<gray>Время: <white>15</white> минут, <white>15:00</white>, <white>30s</white>, <white>15m</white> или <white>1h</white>. От 1 секунды до 24 часов.'
  recording_started: '<gray>Запись <gradient:#FFFFFF:#B0B0B0>{player}</gradient> начата <dark_gray>·</dark_gray> <white>{label}</white> <dark_gray>·</dark_gray> <gray>{time}'
  recording_stopped: '<gray>Запись <gradient:#FFFFFF:#B0B0B0>{player}</gradient> завершена: {reason}. <gray>Удары: <white>{hits}</white> <dark_gray>·</dark_gray> <gray>Записано окон: <white>{windows}'
  recording_stop_confirmed: '<gray>Запись <gradient:#FFFFFF:#B0B0B0>{player}</gradient> остановлена.'
  recording_not_active: '<gray>У <white>{player}</white> нет активной записи.'
  recording_bossbar: '<gradient:#FFFFFF:#AAAAAA>Осталось: {time}</gradient>'
  recording_actionbar: '<gradient:#FFFFFF:#B0B0B0>{player}</gradient> <dark_gray>│</dark_gray> <gray>Удары: <white>{hits}</white> <dark_gray>│</dark_gray> <gray>Окна: <white>{windows}</white> <dark_gray>│</dark_gray> <gray>Сэмплы: <white>{samples}</white> <dark_gray>│</dark_gray> <white>{label}'
  tracker_enabled: '<gray>Наблюдение за <gradient:#FFFFFF:#B0B0B0>{player}</gradient> включено.'
  tracker_disabled: '<gray>Наблюдение за <gradient:#FFFFFF:#B0B0B0>{player}</gradient> отключено.'
  help_header: '<gradient:#FFFFFF:#A0A0A0><bold>SilentAC · команды</bold></gradient>'
  help_lines:
    - '<gradient:#FFFFFF:#B0B0B0>/anguard recording start <name> [time] [legit|cheat]</gradient> <gray>— начать запись'
    - '<gradient:#FFFFFF:#B0B0B0>/anguard recording stop <name></gradient> <gray>— остановить запись'
    - '<gradient:#FFFFFF:#B0B0B0>/anguard info <name></gradient> <gray>— наблюдение в actionbar'
    - '<gradient:#FFFFFF:#B0B0B0>/anguard profile <name></gradient> <gray>— профиль игрока'
    - '<gray>Пример: <white>/anguard recording start Steve 15:00 legit'
  profile_header: '<gradient:#FFFFFF:#A0A0A0><bold>SilentAC · профиль</bold></gradient>'
  profile_footer: '<dark_gray>────────────────────────────'
  profile_lines:
    - '<gray>Игрок: <gradient:#FFFFFF:#B0B0B0>{player}</gradient>'
    - '<gray>Пинг: <white>{ping} мс'
    - '<gray>Клиент: <white>{client}'
    - '<gray>Протокол: <white>{version}'
    - '<gray>Оценка модели: <gradient:#FFFFFF:#B0B0B0>{suspicion}%</gradient>'
    - '<gray>Буфер: <white>{buffer}'
