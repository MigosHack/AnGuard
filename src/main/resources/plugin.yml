name: SilentAC
version: '3.0'
main: xyz.angames.anguardai.SilentAC
api-version: '1.21'
authors: [ SRS ]
description: SilentAC - trainable aim detection and recording tools
depend: [ProtocolLib]

permissions:
  silentac.admin:
    description: Manage SilentAC recordings and profiles.
    default: op
  silentac.bypass:
    description: Bypass aim inference (explicit recording still works).
    default: false
  anguard.admin:
    description: Legacy alias for silentac.admin.
    default: false
    children:
      silentac.admin: true
  anguard.bypass:
    description: Legacy alias for silentac.bypass.
    default: false
    children:
      silentac.bypass: true

commands:
  silentac:
    description: SilentAC recording and inspection commands.
    aliases: [anguard, agac]
    usage: /<command> recording start|stop <name> [time] [legit|cheat]
